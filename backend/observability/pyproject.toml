[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-observability"
version = "1.0.0"
description = "Reusable, framework-agnostic LLM observability: LangSmith tracing + a single local JSONL log, with redaction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
langsmith = ["langsmith>=0.4"]
langchain = ["langchain-core>=0.3"]
langgraph = ["langgraph>=0.2"]
all = ["langsmith>=0.4", "langchain-core>=0.3", "langgraph>=0.2"]
test = ["pytest>=8", "langsmith>=0.4", "langchain-core>=0.3", "langgraph>=0.2"]

[tool.setuptools]
# This directory *is* the `observability` package (it lives inside the host repo as a top-level package).
package-dir = { "observability" = "." }
packages = ["observability", "observability.adapters", "observability.integrations"]
