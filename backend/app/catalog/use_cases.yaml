# Requirement Catalog — the deterministic source of truth for what each
# supported use case requires. The LLM classifies the request; it never
# invents this checklist.
#
# evidence[].human_required marks items that need human judgement and can
# never be auto-generated (PRD section 10: no automated business
# explanations). These drive NEEDS_REVIEW rather than INCOMPLETE.

use_cases:
  UC-01:
    name: "Cost Drill / Expense Drill"
    short_name: "Cost Drill / Expense Drill"
    description: "Retrieve GL, trial balance and cost drill information using period, SOB and NAC criteria."
    icon: "trending-down"
    required_parameters: [period, sob, nac_range, report_type]
    parameter_labels:
      period: "Period"
      sob: "SOB"
      nac_range: "NAC Range"
      report_type: "Report Type"
    evidence:
      - code: GL_DUMP
        label: "GL Dump / Expense Ledger"
      - code: TRIAL_BALANCE
        label: "Trial Balance"
      - code: COST_DRILL_AP
        label: "Cost Drill Report — AP"
      - code: COST_DRILL_AR
        label: "Cost Drill Report — AR"
      - code: COST_DRILL_OTHERS
        label: "Cost Drill Report — Others"
      # Not a document sitting in a source system. This is the underlying
      # transaction-level data, pulled from the `transactions` tables across
      # every source and compiled into a single Excel workbook. `generated`
      # tells the Retrieval Agent to build it rather than search for a file.
      - code: GL_TRANSACTION_LISTING
        label: "GL Transaction Listing (Excel)"
        generated: tabular
    validation_checks:
      - code: EVIDENCE_PRESENT
        label: "Required evidence present"
      - code: PARAM_MATCH
        parameter: period
        label: "Period matches query"
      - code: PARAM_MATCH
        parameter: sob
        label: "SOB matches query"
      - code: PARAM_MATCH
        parameter: nac_range
        label: "NAC range matches query"
      # The checklist requires the AP, AR and Others reports regardless of
      # which one the request named, so this verifies the requested report was
      # retrieved rather than comparing report_type across every document.
      - code: REPORT_TYPE_PRESENT
        label: "Requested report type retrieved"
      - code: DOCUMENT_TYPES
        label: "Document types verified"
      - code: PACKAGE_COMPLETE
        label: "Required package complete"

  UC-02:
    name: "Schedules Requirement"
    short_name: "Schedules Requirement"
    description: "Prepare ledger, movement, balance and ageing schedules for audit."
    icon: "calendar"
    required_parameters: [account, period]
    parameter_labels:
      account: "Account"
      period: "Period"
    evidence:
      - code: LEDGER_EXTRACT
        label: "Ledger Extract"
      - code: OPENING_BALANCE
        label: "Opening Balance"
      - code: MOVEMENT_DETAILS
        label: "Movement / Additions / Adjustments"
      - code: CLOSING_BALANCE
        label: "Closing Balance"
      - code: AGEING_REPORT
        label: "Ageing Details"
      - code: LONG_OUTSTANDING_EXPLANATION
        label: "Long Outstanding Balance Explanations"
        human_required: true
    validation_checks:
      - code: EVIDENCE_PRESENT
        label: "Required evidence present"
      - code: PARAM_MATCH
        parameter: account
        label: "Account matches query"
      - code: PARAM_MATCH
        parameter: period
        label: "Period matches query"
      - code: DOCUMENT_TYPES
        label: "Document types verified"
      - code: PACKAGE_COMPLETE
        label: "Required package complete"

  UC-03:
    name: "Trade Payables Balance Confirmation Samples"
    short_name: "Trade Payables Balance Confirmation"
    description: "Prepare vendor balance confirmation samples and supporting information."
    icon: "landmark"
    # Period alone is enough to assemble the confirmation package: the APTB,
    # ageing and vendor data are all period-scoped. A vendor or sample list
    # narrows the result when supplied, so it is listed as an input but its
    # absence is not an ambiguity.
    required_parameters: [period]
    optional_parameters: [vendor_sample]
    parameter_labels:
      vendor_sample: "Vendor / Sample"
      period: "Period"
    evidence:
      - code: APTB
        label: "Vendor-wise Payable Balances / APTB"
      - code: AGEING_REPORT
        label: "Ageing Report"
      - code: BALANCE_CONFIRMATION_LETTER
        label: "Balance Confirmation Letters"
      - code: VENDOR_CONTACT_DETAILS
        label: "Vendor Contact Details"
      - code: OUTSTANDING_INVOICE_DETAILS
        label: "Outstanding Invoice Details"
    validation_checks:
      - code: EVIDENCE_PRESENT
        label: "Required evidence present"
      - code: PARAM_MATCH
        parameter: vendor_name
        label: "Vendor matches query"
      - code: PARAM_MATCH
        parameter: period
        label: "Period matches query"
      - code: DOCUMENT_TYPES
        label: "Document types verified"
      - code: PACKAGE_COMPLETE
        label: "Required package complete"

  UC-04:
    name: "Balance Confirmation Alternate Testing"
    short_name: "Balance Confirmation Alternate Testing"
    description: "Retrieve invoice, PO, GRN, SES and supporting documents for alternate testing."
    icon: "file-search"
    required_parameters: [vendor_name, invoice_number]
    parameter_labels:
      vendor_name: "Vendor"
      invoice_number: "Invoice Number"
    evidence:
      - code: INVOICE
        label: "Invoice"
      - code: PURCHASE_ORDER
        label: "Purchase Order"
      - code: GRN
        label: "GRN"
      - code: SES
        label: "SES"
      - code: SUPPORTING_DOCUMENT
        label: "Supporting Document"
    validation_checks:
      - code: EVIDENCE_PRESENT
        label: "Required evidence present"
      - code: PARAM_MATCH
        parameter: vendor_name
        label: "Vendor matches query"
      - code: PARAM_MATCH
        parameter: invoice_number
        label: "Invoice number matches"
      - code: DOCUMENT_TYPES
        label: "Document types verified"
      - code: PACKAGE_COMPLETE
        label: "Required package complete"
