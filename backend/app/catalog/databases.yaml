# Database Registry.
#
# The POC deliberately does NOT map evidence types to systems. This registry
# only declares which sources are searchable and in what order. Changing the
# order here changes both the search sequence and the UI timeline, with no
# code edits.

databases:
  - database_id: "DB-01"
    name: "Oracle ERP"
    path: "databases/db01.sqlite"
    enabled: true
    search_order: 1
  - database_id: "DB-02"
    name: "SAP Ariba"
    path: "databases/db02.sqlite"
    enabled: true
    search_order: 2
  - database_id: "DB-03"
    name: "Sharepoint"
    path: "databases/db03.sqlite"
    enabled: true
    search_order: 3
  - database_id: "DB-04"
    name: "DB-04"
    path: "databases/db04.sqlite"
    enabled: true
    search_order: 4
